name: Leroy boot localization sweep - offline fail-closed model

on:
  pull_request:
    paths:
      - 'ros/boot_localization_*.py'
      - 'ros/boot_yaw_*.py'
      - 'ros/live_manual_yaw_witness*'
      - 'ros/live_boot_yaw*'
      - 'ros/live_boot_imu_service.py'
      - 'ros/live_boot_session.sh'
      - 'ros/live_boot_service_test.py'
      - 'ros/live_boot_readiness*'
      - 'ros/BOOT_LOCALIZATION_SWEEP_DESIGN.md'
      - 'ros/CURRENT_LIVE_RUNTIME.md'
      - 'ros/current_live_runtime_test.py'
      - 'ros/src/leroy_bridge/config/leroy_bridge.yaml'
      - 'ros/src/leroy_bridge/leroy_bridge/node.py'
      - 'ros/src/leroy_bridge/README.md'
      - 'ros/src/leroy_nav2/README.md'
      - '.github/workflows/leroy-boot-localization-offline.yml'
  push:
    branches:
      - design/boot-localization-sweep
    paths:
      - 'ros/boot_localization_*.py'
      - 'ros/boot_yaw_*.py'
      - 'ros/live_manual_yaw_witness*'
      - 'ros/live_boot_yaw*'
      - 'ros/live_boot_imu_service.py'
      - 'ros/live_boot_session.sh'
      - 'ros/live_boot_service_test.py'
      - 'ros/live_boot_readiness*'
      - 'ros/BOOT_LOCALIZATION_SWEEP_DESIGN.md'
      - 'ros/CURRENT_LIVE_RUNTIME.md'
      - 'ros/current_live_runtime_test.py'
      - 'ros/src/leroy_bridge/config/leroy_bridge.yaml'
      - 'ros/src/leroy_bridge/leroy_bridge/node.py'
      - 'ros/src/leroy_bridge/README.md'
      - 'ros/src/leroy_nav2/README.md'
      - '.github/workflows/leroy-boot-localization-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-no-device:
    name: Sweep state machine and latched-stop diagnostics (no ROS/device)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail-closed supervisor regressions
        working-directory: ros
        run: python3 -m unittest -v boot_localization_core_test
      - name: Real Stage 3 read-only sidecar isolation contract
        working-directory: ros
        run: python3 -m unittest -v live_boot_readiness_test
      - name: Guard current live defaults and retired bridge parameters
        working-directory: ros
        run: python3 -m unittest -v current_live_runtime_test
      - name: Live yaw source-independent unit tests
        working-directory: ros
        run: python3 -m unittest -v boot_yaw_core_test
      - name: Persistent real IMU lifecycle contract
        working-directory: ros
        run: python3 -m unittest -v live_boot_service_test
      - name: Live yaw tracking witness and zero-command boundaries
        working-directory: ros
        run: python3 -m unittest -v boot_yaw_tracking_test
      - name: Deterministic no-hardware diagnostic simulation
        working-directory: ros
        run: |
          python3 boot_localization_demo.py | tee /tmp/leroy-boot-model.log
          grep -Fx 'BOOT_SYNTHETIC_SWEEP=PASS_NEEDS_PARALLAX' /tmp/leroy-boot-model.log
          grep -Fx 'BOOT_SYNTHETIC_OBSTACLE=PASS_LATCHED' /tmp/leroy-boot-model.log
          grep -Fx 'BOOT_MODEL=PASS_NO_ROS_NO_DEVICES_NO_ACTUATION' /tmp/leroy-boot-model.log
