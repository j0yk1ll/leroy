name: Leroy Stage 4B offline calibration-readiness contracts

on:
  pull_request:
    paths:
      - 'ros/live_stage4b_*'
      - 'ros/live_stage4_imu_overlap.py'
      - 'ros/Dockerfile.live-stage4-imu'
      - 'ros/LIVE_STAGE4B_READINESS.md'
      - '.github/workflows/leroy-stage4b-source.yml'
  push:
    branches: [main]
    paths:
      - 'ros/live_stage4b_*'
      - 'ros/live_stage4_imu_overlap.py'
      - 'ros/Dockerfile.live-stage4-imu'

jobs:
  offline-and-no-device:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax only; no ROS runtime or devices
        run: |
          python -m compileall -q ros/live_stage4b_evidence_audit.py \
            ros/live_stage4b_delivery_trace.py ros/live_stage4b_test.py \
            ros/live_stage4_imu_overlap.py
          bash -n ros/live_stage4_imu_sidecar.sh
      - name: Stage 4B audit and exact-stamp tests
        run: |
          cd ros
          python -m unittest -v live_stage4b_test live_stage4_contract_test
