name: Leroy Stage 4C passive capture candidate (no devices)

on:
  pull_request:
    paths:
      - 'ros/live_stage4c_*'
      - 'ros/Dockerfile.live-stage4c-capture'
      - 'ros/LIVE_STAGE4C_CALIBRATION_EVIDENCE.md'
      - '.github/workflows/leroy-stage4c-offline.yml'
  push:
    branches: [main]
    paths:
      - 'ros/live_stage4c_*'
      - 'ros/Dockerfile.live-stage4c-capture'

jobs:
  no-device-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile no-device Stage 4C candidate
        run: |
          python -m compileall -q \
            ros/live_stage4c_capture_contract.py \
            ros/live_stage4c_passive_recorder.py \
            ros/live_stage4c_source_meta.py \
            ros/live_stage4c_source_meta_test.py \
            ros/live_stage4c_source_meta_ros.py \
            ros/live_stage4c_source_meta_ros_test.py \
            ros/live_stage4c_rosbag_smoke.py \
            ros/live_stage4c_synthetic_dds_bag.py \
            ros/live_stage4c_synthetic_dds_test.py \
            ros/live_stage4c_capture_test.py
      - name: Pure no-device fault and safety contracts
        run: |
          cd ros
          python -m unittest -v live_stage4c_capture_test live_stage4c_source_meta_test live_stage4c_source_meta_ros_test live_stage4c_synthetic_dds_test
          python -Werror::SyntaxWarning live_stage4c_passive_recorder.py --contract-smoke
      - name: Check separately commissioned capture with inert image default
        run: |
          grep -Fqx 'LIVE_CAPTURE_COMMISSIONED = True' ros/live_stage4c_passive_recorder.py
          grep -Fq 'if not LIVE_CAPTURE_COMMISSIONED:' ros/live_stage4c_passive_recorder.py
          grep -Fqx 'CMD ["/bin/false"]' ros/Dockerfile.live-stage4c-capture
          ! grep -Eq '^(ENTRYPOINT|CMD \["/opt/stage4c)' ros/Dockerfile.live-stage4c-capture
