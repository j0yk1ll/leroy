name: Leroy Stage 3 sensor-only source contract

on:
  pull_request:
    paths:
      - 'ros/Dockerfile.live-*'
      - 'ros/live_stage3_*'
      - 'ros/LIVE_STAGE3_REPRODUCIBLE.md'
      - 'ros/src/leroy_description/**'
      - 'ros/src/leroy_nav2_perception/**'
      - '.github/workflows/leroy-stage3-source.yml'
  push:
    branches: [main]
    paths:
      - 'ros/Dockerfile.live-*'
      - 'ros/live_stage3_*'
      - 'ros/src/leroy_description/**'
      - 'ros/src/leroy_nav2_perception/**'

jobs:
  static-sensor-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Shell syntax, without hardware
        run: |
          bash -n ros/live_stage3_build.sh
          bash -n ros/live_stage3_start.sh
          bash -n ros/live_stage3_monocular_sidecar.sh
      - name: Python syntax, without ROS runtime imports
        run: |
          python -m compileall -q             ros/live_stage3_start_static_test.py             ros/live_stage3_sidecar_static_test.py             ros/src/leroy_description/launch             ros/src/leroy_nav2_perception/launch             ros/src/leroy_nav2_perception/leroy_nav2_perception
      - name: Guard contracts, with no robot devices
        run: |
          cd ros
          python -m unittest -v live_stage3_start_static_test live_stage3_sidecar_static_test
          python -m unittest discover -s src/leroy_nav2_perception/test             -p test_live_costmap_static_contract.py -v
