name: Leroy Stage 4A isolated IMU source safety

on:
  pull_request:
    paths:
      - 'ros/live_stage4_*'
      - 'ros/Dockerfile.live-stage4-imu'
      - 'ros/LIVE_STAGE4A_IMU.md'
      - 'ros/m18_imu_stream_contract.py'
      - '.github/workflows/leroy-stage4a-source.yml'
  push:
    branches: [main]
    paths:
      - 'ros/live_stage4_*'
      - 'ros/Dockerfile.live-stage4-imu'

jobs:
  no-device-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax and passive Python compile (NO hardware)
        run: |
          bash -n ros/live_stage4_imu_sidecar.sh
          python -m compileall -q ros/live_stage4_imu_overlap.py ros/live_stage4_contract_test.py
      - name: MCU protocol / ROS isolation / motor inhibition contracts
        run: |
          cd ros
          python -m unittest -v live_stage4_contract_test
