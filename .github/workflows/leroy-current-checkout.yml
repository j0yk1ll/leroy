name: Leroy production source - fail-closed offline regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production test dependencies
        run: python -m pip install --disable-pip-version-check PyYAML numpy pytest
      - name: Check production architecture, motion inhibition and retained algorithm tests
        working-directory: ros
        run: bash ./leroy.sh check
