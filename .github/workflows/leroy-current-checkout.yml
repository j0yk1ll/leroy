name: Leroy portable current checkout (no devices)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Current image source contract and standalone boot regressions
        working-directory: ros
        run: bash ./check_current_checkout.sh
