name: Leroy integrated runtime - no-device source and regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static contract dependencies
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: One checkout and all retained camera/IMU/no-device regressions
        working-directory: ros
        run: bash ./leroy.sh check
