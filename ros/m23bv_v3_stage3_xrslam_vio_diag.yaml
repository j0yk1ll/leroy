# Stage 3 XRSLAM camera+MCU IMU diagnostic ONLY.
# Tuning copied from pinned XRSLAM 53adcdafd065ec1b2239b9d000205ea243e8342d
# configs/euroc_slam.yaml; NOT robot-calibrated, NOT production navigation.
# Adapted to monocular_imu mode with IMU refinement for diagnostics only.
# Camera-IMU offset ZERO is a provisional initialization DIAGNOSTIC guess,
# NOT a measured temporal offset. Spatial extrinsics are also provisional.
# Native XRSLAM may initialize/tracking; ROS metric pose/odom stay inhibited.
sensor:
  mode: monocular_imu
output:
  q_bo: [0.0, 0.0, 0.0, 1.0]
  p_bo: [0.0, 0.0, 0.0]
sliding_window:
  size: 10
  subframe_size: 3
  force_keyframe_landmarks: 35
feature_tracker:
  min_keypoint_distance: 20.0
  max_keypoint_detection: 200
  max_init_frames: 60
  max_frames: 20
  predict_keypoints: true
  clahe_clip_limit: 6.0
  clahe_width: 8
  clahe_height: 8
initializer:
  keyframe_num: 8
  keyframe_gap: 5
  min_matches: 50
  min_parallax: 10.0
  min_triangulation: 20
  min_landmarks: 30
  refine_imu: true
solver:
  iteration_limit: 30
  time_limit: 1.0e6
rotation:
  misalignment_threshold: 0.02
  ransac_threshold: 10
parsac:
  parsac_flag: false
  dynamic_probability: 0.15
  threshold: 1.0
  norm_scale: 1.0
  keyframe_check_size: 1
