# Jazzy navigation-only backend: odom is the shared global frame until map
# localization/loop closure is commissioned. No map->odom TF is synthesized.
# Nav2 input map is a calibrated rolling odom occupancy grid.
amcl:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: -0.10
      max_vel_x: 0.10
      min_vel_y: -0.10
      max_vel_y: 0.10
      max_vel_theta: 0.20
      min_speed_xy: 0.0
      max_speed_xy: 0.14
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.3
      acc_lim_theta: 0.5
      decel_lim_x: -0.3
      decel_lim_y: -0.3
      decel_lim_theta: -0.5
      vx_samples: 9
      vy_samples: 9
      vtheta_samples: 15
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.03
      PathAlign.scale: 20.0
      GoalAlign.scale: 16.0
      PathDist.scale: 26.0
      GoalDist.scale: 26.0
      PathAlign.forward_point_distance: 0.12
      GoalAlign.forward_point_distance: 0.12

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait", "backup", "drive_on_heading"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.2
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.5

bt_navigator:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.2
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    always_reload_bt_xml: false

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      footprint: "[[0.28, 0.19], [0.28, -0.19], [-0.28, -0.19], [-0.28, 0.19]]"
      resolution: 0.10
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /leroy/navigation/occupancy_grid
        map_subscribe_transient_local: false
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      footprint: "[[0.28, 0.19], [0.28, -0.19], [-0.28, -0.19], [-0.28, 0.19]]"
      resolution: 0.10
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /leroy/navigation/occupancy_grid
        map_subscribe_transient_local: false
        subscribe_to_updates: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true
