# M5 OFFLINE controller ONLY; all limits/footprint and movement are fictional.
# The controller's cmd_vel MUST be hard remapped in launch, never used directly.
# /odom is NOT published: the odom subscriber consumes diagnostic synthetic odom.
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.5
    odom_topic: /leroy_nav2/diagnostics/synthetic_odom
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      time_steps: 20
      model_dt: 0.1
      batch_size: 400
      iteration_count: 1
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.15
      wz_max: 0.3
      ax_max: 0.2
      ax_min: -0.2
      ay_max: 0.2
      ay_min: -0.2
      az_max: 0.4
      vx_std: 0.1
      vy_std: 0.1
      wz_std: 0.2
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.0
      transform_tolerance: 0.2
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "TwirlingCritic"
      ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 2.0
      rolling_window: true
      track_unknown_space: true
      width: 4
      height: 4
      resolution: 0.05
      transform_tolerance: 0.2
      footprint: "[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: false
        combination_method: 1
        observation_sources: "depth_points"
        depth_points:
          topic: /leroy_nav2/diagnostics/obstacle_points
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: -0.1
          max_obstacle_height: 1.5
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          observation_persistence: 3.0
          expected_update_rate: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.65
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
