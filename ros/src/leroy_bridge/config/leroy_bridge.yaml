leroy_bridge:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baudrate: 115200

    imu_stream_hz: 100
    encoder_stream_hz: 50
    watchdog_ms: 500
    keepalive_period_s: 0.10
    cmd_vel_timeout_s: 0.25

    imu_frame_id: imu_link

    wheel_radius_m: 0.020
    half_wheelbase_m: 0.180
    half_track_m: 0.275

    # Provisional OPEN-LOOP scaling: nominal wheel rad/s corresponding to
    # hardware PWM 255, NOT a measured physical speed limit. Smaller values
    # result in MORE PWM for the same /cmd_vel command.
    # Supervised low-duty test only; keep the hardware E-stop accessible.
    pwm_full_scale_wheel_velocity_rad_s: 20.0
    # Independent motor duty ceiling (25% of 255).
    max_pwm: 64

    # Encoder calibration.
    encoder_counts_per_rev: 2464
    front_left_encoder_sign: -1
    rear_left_encoder_sign: -1
    front_right_encoder_sign: 0
    rear_right_encoder_sign: 0

    # Diagnostic fallback only; never enable alongside XRSLAM.
    # With this disabled the bridge does not advertise /odom or dynamic odom TF.
    degraded_odometry_enabled: false

    odom_frame_id: odom
    base_frame_id: base_link
    publish_odom_tf: false