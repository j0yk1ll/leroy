leroy_bridge:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baudrate: 115200

    imu_stream_hz: 100
    encoder_stream_hz: 50
    watchdog_ms: 500
    keepalive_period_s: 0.10
    cmd_vel_timeout_s: 0.25

    imu_frame_id: imu_link

    wheel_radius_m: 0.020
    half_wheelbase_m: 0.180
    half_track_m: 0.275

    # M22D: legacy calibration record ONLY; cannot enable motion.
    # The current bridge has NO raw /cmd_vel subscription and its unique
    # serial writer rejects ALL nonzero set_wheels packets.
    # 12.75 remains a provisional PWM/(wheel rad/s) reference for M22C
    # synthetic math tests, NOT an active movement configuration.
    wheel_velocity_to_pwm_gain: 12.75
    # Independent 25%-of-full-scale motor duty ceiling.
    max_pwm: 64

    # Encoder calibration.
    encoder_counts_per_rev: 2464
    front_left_encoder_sign: -1
    rear_left_encoder_sign: -1
    front_right_encoder_sign: 0
    rear_right_encoder_sign: 0

    # Diagnostic fallback only; never enable alongside XRSLAM.
    # With this disabled the bridge does not advertise /odom or dynamic odom TF.
    degraded_odometry_enabled: false

    odom_frame_id: odom
    base_frame_id: base_link
    publish_odom_tf: false