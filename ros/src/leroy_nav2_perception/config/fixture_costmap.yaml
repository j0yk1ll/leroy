# Standalone Nav2 Jazzy costmap for offline fixture; NO controller_server.
# This is a synthetic base_link-centered snapshot, NOT a live odom/map source.
costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: base_link
    robot_base_frame: base_link
    update_frequency: 1.0
    publish_frequency: 1.0
    rolling_window: true
    track_unknown_space: true
    width: 4
    height: 4
    resolution: 0.05
    transform_tolerance: 0.2
    # Arbitrary simulated footprint; actual Leroy outer shape is unmeasured.
    footprint: "[[0.5, 0.5], [0.5, -0.5], [-0.5, -0.5], [-0.5, 0.5]]"
    plugins: ["obstacle_layer", "inflation_layer"]
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: "depth_points"
      depth_points:
        topic: /leroy_nav2/diagnostics/obstacle_points
        data_type: PointCloud2
        marking: true
        clearing: false
        min_obstacle_height: -0.1
        max_obstacle_height: 1.5
        obstacle_min_range: 0.0
        obstacle_max_range: 3.0
        observation_persistence: 3.0
        # Stale observations do not imply drive permission; there is no gate.
        expected_update_rate: 0.0
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.3
      cost_scaling_factor: 3.0
    always_send_full_costmap: true
